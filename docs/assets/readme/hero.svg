<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t">
<title id="t">Containust — containers without the daemon</title>
<style>

.serif { font-family: Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif; }
.sans { font-family: Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.head { fill: #f0a56a; font-weight: 600; letter-spacing: .02em; }
.dim { fill: #8fa8bc; }
.rise { animation: rise 1.1s cubic-bezier(.22,1,.36,1) both; }
.d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.glow { animation: breathe 7s ease-in-out infinite; transform-origin: 900px 200px; }
@keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.08); } }
.wire { stroke: #8fa8bc; stroke-opacity: .35; stroke-width: 2; fill: none; }
.pulse { stroke: #f0a56a; stroke-width: 3; fill: none; stroke-linecap: round;
  stroke-dasharray: 14 520; animation: flow 3.2s linear infinite; }
.p2 { animation-delay: 1.1s; } .p3 { animation-delay: 2.1s; }
@keyframes flow { from { stroke-dashoffset: 534; } to { stroke-dashoffset: 0; } }
.node { animation: rise 1s cubic-bezier(.22,1,.36,1) both; }
.n1 { animation-delay: .5s; } .n2 { animation-delay: .7s; } .n3 { animation-delay: .9s; }
.halo { stroke: #d4894a; stroke-width: 1.5; opacity: 0; animation: halo 6s ease-in-out infinite; }
.n1 .halo { animation-delay: 1s; } .n2 .halo { animation-delay: 3s; } .n3 .halo { animation-delay: 5s; }
@keyframes halo { 0%,100% { opacity: 0; } 12% { opacity: 1; } 30% { opacity: 0; } }
.led { fill: #7fd1a8; animation: led 2.4s ease-in-out infinite; }
@keyframes led { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.ghost { animation: ghost 6s ease-in-out infinite; }
@keyframes ghost { 0%,100% { opacity: .55; } 50% { opacity: .25; } }
.caret { fill: #f0a56a; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse, .flow { opacity: 0; } }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071018"/><stop offset="1" stop-color="#0e1c2e"/>
  </linearGradient>
  <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#d4894a" stop-opacity=".45"/>
    <stop offset="1" stop-color="#d4894a" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="frame"><rect width="1280" height="460" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="460" fill="url(#bg)"/>
  <g stroke="rgba(143,168,188,0.18)" stroke-width="1" opacity="0.35"><path d="M32 0V460"/><path d="M64 0V460"/><path d="M96 0V460"/><path d="M128 0V460"/><path d="M160 0V460"/><path d="M192 0V460"/><path d="M224 0V460"/><path d="M256 0V460"/><path d="M288 0V460"/><path d="M320 0V460"/><path d="M352 0V460"/><path d="M384 0V460"/><path d="M416 0V460"/><path d="M448 0V460"/><path d="M480 0V460"/><path d="M512 0V460"/><path d="M544 0V460"/><path d="M576 0V460"/><path d="M608 0V460"/><path d="M640 0V460"/><path d="M672 0V460"/><path d="M704 0V460"/><path d="M736 0V460"/><path d="M768 0V460"/><path d="M800 0V460"/><path d="M832 0V460"/><path d="M864 0V460"/><path d="M896 0V460"/><path d="M928 0V460"/><path d="M960 0V460"/><path d="M992 0V460"/><path d="M1024 0V460"/><path d="M1056 0V460"/><path d="M1088 0V460"/><path d="M1120 0V460"/><path d="M1152 0V460"/><path d="M1184 0V460"/><path d="M1216 0V460"/><path d="M1248 0V460"/><path d="M0 32H1280"/><path d="M0 64H1280"/><path d="M0 96H1280"/><path d="M0 128H1280"/><path d="M0 160H1280"/><path d="M0 192H1280"/><path d="M0 224H1280"/><path d="M0 256H1280"/><path d="M0 288H1280"/><path d="M0 320H1280"/><path d="M0 352H1280"/><path d="M0 384H1280"/><path d="M0 416H1280"/><path d="M0 448H1280"/></g>
  <ellipse class="glow" cx="900" cy="200" rx="420" ry="260" fill="url(#ember)"/>

  <text x="64" y="104" class="mono dim rise" style="font-size:14px;letter-spacing:.22em">DAEMON-LESS · LOCAL-FIRST · AIR-GAPPED</text>
  <text x="60" y="196" class="serif rise d1" style="font-size:92px;font-weight:700" fill="#f4efe6">Containust</text>
  <text x="64" y="246" class="sans rise d2" style="font-size:26px;font-weight:600" fill="#f0a56a">Containers without the daemon.</text>
  <text x="64" y="290" class="sans rise d2" style="font-size:18px" fill="#e8e2d6">Declare a stack in <tspan class="mono" style="font-size:17px" fill="#f0a56a">.ctst</tspan>, plan the diff, apply it —</text>
  <text x="64" y="316" class="sans rise d2" style="font-size:18px" fill="#e8e2d6">no root daemon, no registry required, no network if you say so.</text>

  <g class="rise d3">
    <rect x="64" y="350" width="372" height="48" rx="10" fill="#071018" stroke="rgba(143,168,188,0.18)"/>
    <text x="84" y="380" class="mono" style="font-size:16px" fill="#8fa8bc">$ <tspan fill="#f4efe6">ctst run</tspan> <tspan fill="#f0a56a">stack.ctst</tspan></text>
    <rect x="304" y="366" width="9" height="18" class="caret"/>
  </g>

  <path class="wire" d="M854 134 C 920 134, 914 222, 976 222"/>
  <path class="wire" d="M854 324 C 920 324, 914 252, 976 252"/>
  <path class="pulse" d="M854 134 C 920 134, 914 222, 976 222"/>
  <path class="pulse p2" d="M854 324 C 920 324, 914 252, 976 252"/>

  <g class="node n1">
  <rect x="610" y="90" width="244" height="88" rx="12" fill="#0e1c2e" stroke="rgba(143,168,188,0.18)"/>
  <rect x="610" y="90" width="244" height="88" rx="12" fill="none" class="halo"/>
  <circle cx="628" cy="110" r="4" class="led"/>
  <text x="640" y="114" class="mono head">COMPONENT web</text>
  <text x="628" y="144" class="mono dim">image = "preset://alpine"</text><text x="628" y="166" class="mono dim">port  = 8080</text>
</g>
  <g class="node n2">
  <rect x="610" y="280" width="244" height="88" rx="12" fill="#0e1c2e" stroke="rgba(143,168,188,0.18)"/>
  <rect x="610" y="280" width="244" height="88" rx="12" fill="none" class="halo"/>
  <circle cx="628" cy="300" r="4" class="led"/>
  <text x="640" y="304" class="mono head">COMPONENT worker</text>
  <text x="628" y="334" class="mono dim">image = "tar:///img/w.tar"</text><text x="628" y="356" class="mono dim">memory = "256MiB"</text>
</g>
  <g class="node n3">
  <rect x="976" y="192" width="244" height="88" rx="12" fill="#0e1c2e" stroke="rgba(143,168,188,0.18)"/>
  <rect x="976" y="192" width="244" height="88" rx="12" fill="none" class="halo"/>
  <circle cx="994" cy="212" r="4" class="led"/>
  <text x="1006" y="216" class="mono head">COMPONENT db</text>
  <text x="994" y="246" class="mono dim">image = "oci://postgres@…"</text><text x="994" y="268" class="mono dim">port  = 5432</text>
</g>

  <g class="ghost">
    <rect x="998" y="330" width="200" height="50" rx="10" fill="none" stroke="#ef8a80" stroke-dasharray="5 5"/>
    <text x="1098" y="360" text-anchor="middle" class="mono" style="font-size:15px" fill="#ef8a80">dockerd</text>
    <path d="M1056 355 H1140" stroke="#ef8a80" stroke-width="2"/>
    <text x="1098" y="404" text-anchor="middle" class="mono dim" style="font-size:12px">not required</text>
  </g>
</g>

</svg>

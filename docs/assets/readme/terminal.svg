<text x="460" y="24" text-anchor="middle" class="bar">ctst — declarative plan &amp; apply</text>
<clipPath id="inner"><rect x="2" y="38" width="916" height="486"/></clipPath>
<g clip-path="url(#inner)">
<g style="animation: r0 18.0s linear infinite"><text x="28" y="64" class="mono"><tspan fill="#d4894a">$ </tspan><tspan fill="#f4efe6">ctst plan </tspan><tspan fill="#f0a56a">stack.ctst</tspan></text><rect x="46" y="47" width="860" height="23" fill="#071018" style="transform: translateX(196px); animation: c0 18.0s steps(20, end) infinite"/></g>
<text x="28" y="88" class="mono" style="animation: r1 18.0s ease-out infinite"><tspan fill="#f4efe6">Plan for stack.ctst</tspan></text>
<text x="28" y="112" class="mono" style="animation: r2 18.0s ease-out infinite"><tspan fill="#7fd1a8">  + create   </tspan><tspan fill="#f4efe6">db</tspan></text>
<text x="28" y="136" class="mono" style="animation: r3 18.0s ease-out infinite"><tspan fill="#7fd1a8">  + create   </tspan><tspan fill="#f4efe6">api</tspan></text>
<text x="28" y="160" class="mono" style="animation: r4 18.0s ease-out infinite"><tspan fill="#7fd1a8">  + create   </tspan><tspan fill="#f4efe6">web</tspan></text>
<text x="28" y="184" class="mono" style="animation: r5 18.0s ease-out infinite"><tspan fill="#8fa8bc">  Plan: 3 to create, 0 to replace, 0 unchanged.</tspan></text>
<g style="animation: r6 18.0s linear infinite"><text x="28" y="208" class="mono"><tspan fill="#d4894a">$ </tspan><tspan fill="#f4efe6">ctst run -d </tspan><tspan fill="#f0a56a">stack.ctst</tspan></text><rect x="46" y="191" width="860" height="23" fill="#071018" style="transform: translateX(214px); animation: c6 18.0s steps(22, end) infinite"/></g>
<text x="28" y="232" class="mono" style="animation: r7 18.0s ease-out infinite"><tspan fill="#7fd1a8">  ● db   </tspan><tspan fill="#8fa8bc">[a41f…]</tspan><tspan fill="#7cc4e8">  -&gt; localhost:5432</tspan></text>
<text x="28" y="256" class="mono" style="animation: r8 18.0s ease-out infinite"><tspan fill="#7fd1a8">  ● api  </tspan><tspan fill="#8fa8bc">[7c02…]</tspan><tspan fill="#7cc4e8">  -&gt; localhost:8080</tspan></text>
<text x="28" y="280" class="mono" style="animation: r9 18.0s ease-out infinite"><tspan fill="#7fd1a8">  ● web  </tspan><tspan fill="#8fa8bc">[e9b3…]</tspan><tspan fill="#7cc4e8">  -&gt; localhost:3000</tspan></text>
<g style="animation: r10 18.0s linear infinite"><text x="28" y="304" class="mono"><tspan fill="#d4894a">$ </tspan><tspan fill="#f4efe6">sed -i 's/pg15/pg16/' stack.ctst &amp;&amp; ctst plan</tspan></text><rect x="46" y="287" width="860" height="23" fill="#071018" style="transform: translateX(426px); animation: c10 18.0s steps(45, end) infinite"/></g>
<text x="28" y="328" class="mono" style="animation: r11 18.0s ease-out infinite"><tspan fill="#f2c66d">  ~ replace  </tspan><tspan fill="#f4efe6">db </tspan><tspan fill="#8fa8bc">(spec changed)</tspan></text>
<text x="28" y="352" class="mono" style="animation: r12 18.0s ease-out infinite"><tspan fill="#f2c66d">  ~ replace  </tspan><tspan fill="#f4efe6">api </tspan><tspan fill="#8fa8bc">(upstream 'db' replaced)</tspan></text>
<text x="28" y="376" class="mono" style="animation: r13 18.0s ease-out infinite"><tspan fill="#8fa8bc">  = keep     </tspan><tspan fill="#f4efe6">web</tspan></text>
<g style="animation: r14 18.0s linear infinite"><text x="28" y="400" class="mono"><tspan fill="#d4894a">$ </tspan><tspan fill="#f4efe6">ctst run -d </tspan><tspan fill="#f0a56a">stack.ctst</tspan><tspan fill="#f4efe6"> &amp;&amp; ctst plan</tspan></text><rect x="46" y="383" width="860" height="23" fill="#071018" style="transform: translateX(334px); animation: c14 18.0s steps(35, end) infinite"/></g>
<text x="28" y="424" class="mono" style="animation: r15 18.0s ease-out infinite"><tspan fill="#8fa8bc">  Replacing container 'db' (spec changed)...</tspan></text>
<text x="28" y="448" class="mono" style="animation: r16 18.0s ease-out infinite"><tspan fill="#8fa8bc">  Replacing container 'api' (upstream 'db' replaced)...</tspan></text>
